# BIM viewer behind nginx: `docker compose up -d --build`, then open http://localhost:8080
# (see deploy/README.md for HTTPS, backups and settings).
services:
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    init: true
    environment:
      MAX_UPLOAD_MB: "500"
    volumes:
      - bim-data:/data
    # Not published: only nginx talks to the API.
    expose: ["3001"]

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${BIM_PORT:-8080}:80"

volumes:
  bim-data:
