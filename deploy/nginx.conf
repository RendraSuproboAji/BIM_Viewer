# nginx in front of the BIM viewer (see deploy/README.md).
# nginx serves the built web app straight from disk (precompressed, cached);
# only /api/ reaches Node, over kept-alive upstream connections.

upstream bim_api {
    server api:3001;
    keepalive 16;
}

# Keep the scheme the client used when TLS ends at a proxy/load balancer in front of nginx
# (the API marks the session cookie Secure only over HTTPS).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    # Static files: zero-copy sends, cached file handles.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=1000 inactive=5m;
    open_file_cache_valid 1m;
    open_file_cache_errors off;

    # Serve the .gz files made at build time (no CPU per request); compress the rest on the fly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv application/json application/javascript
               application/xml image/svg+xml application/wasm;

    # Same limit as the API's MAX_UPLOAD_MB (models and .bcfzip uploads).
    client_max_body_size 500m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Hashed build output never changes under the same name: cache it for a year.
    location ^~ /assets/ {
        # Module workers need a JavaScript MIME type for .mjs (older mime.types lack it).
        types {
            application/javascript js mjs;
            text/css css;
            application/wasm wasm;
            image/svg+xml svg;
            image/png png;
            font/woff2 woff2;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # web-ifc WASM (not hashed): cache for a day, revalidate after.
    location ^~ /web-ifc/ {
        types { application/wasm wasm; application/javascript js; }
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://bim_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Stream large uploads/downloads instead of spooling them to disk.
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The app shell: always revalidate so a new deploy is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Client-side routes get the app; files that don't exist get a real 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }
}
